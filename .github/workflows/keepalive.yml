name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render backend
        env:
          FLASK_URL: ${{ vars.FLASK_URL || 'https://quotex-bot-backend.onrender.com' }}
        run: |
          set -euo pipefail
          url="${FLASK_URL%/}/healthz"
          echo "Pinging $url"
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 "$url")
          echo "HTTP $code"
          test "$code" -ge 200 -a "$code" -lt 400
